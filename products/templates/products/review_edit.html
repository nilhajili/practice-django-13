{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Review</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900 min-h-screen">

<div class="max-w-2xl mx-auto px-6 py-12">

    <!-- HEADER -->

    <div class="text-center mb-8">

        <div class="inline-flex items-center justify-center
                    w-16 h-16 rounded-full bg-blue-100
                    text-blue-600 text-3xl mb-4">

        </div>

        <h1 class="text-4xl font-bold">
            Edit Review
        </h1>

        <p class="text-gray-500 mt-3">
            Update your review and rating
        </p>

    </div>


    <!-- FORM CARD -->

    <div class="bg-white rounded-3xl shadow-lg p-8">

        <form method="post" class="space-y-6">

            {% csrf_token %}


            <!-- REVIEW TEXT -->

            <div>

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Your Review
                </label>

                <textarea
                    name="text"
                    rows="6"
                    required
                    placeholder="Write your review..."
                    class="w-full px-4 py-3
                           border border-gray-300
                           rounded-xl
                           text-gray-900
                           placeholder-gray-400
                           focus:outline-none
                           focus:ring-2 focus:ring-blue-500
                           focus:border-transparent
                           resize-none"
                >{{ review.text }}</textarea>

            </div>


            <!-- RATING -->

            <div>

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Rating
                </label>

                <div class="relative">

                    <input
                        type="number"
                        name="rating"
                        min="1"
                        max="5"
                        value="{{ review.rating }}"
                        required
                        class="w-full px-4 py-3
                               border border-gray-300
                               rounded-xl
                               focus:outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:border-transparent"
                    >

                </div>

                <p class="text-sm text-gray-400 mt-2">
                    Choose a rating between 1 and 5.
                </p>

            </div>


            <!-- BUTTONS -->

            <div class="flex flex-col sm:flex-row gap-3 pt-2">

                <button
                    type="submit"
                    class="flex-1 bg-blue-600
                           text-white py-3 px-6
                           rounded-xl
                           font-semibold
                           hover:bg-blue-700
                           transition duration-200"
                >
                    ✓ Save Changes
                </button>


                <a
                    href="{% url 'product_detail' review.product.id %}"
                    class="flex-1 text-center
                           bg-gray-100
                           text-gray-700
                           py-3 px-6
                           rounded-xl
                           font-semibold
                           hover:bg-gray-200
                           transition duration-200"
                >
                    ← Cancel
                </a>

            </div>

        </form>

    </div>


    <!-- PRODUCT INFO -->

    <div class="bg-white rounded-2xl shadow-sm
                p-5 mt-5">

        <p class="text-sm text-gray-400">
            Editing review for
        </p>

        <p class="font-semibold text-lg mt-1">
            {{ review.product.name }}
        </p>

    </div>

</div>

</body>
</html>
